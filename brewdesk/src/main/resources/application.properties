spring.application.name=brewdesk

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/brewdesk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234567}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${SERVER_PORT:9090}

jwt.secret=${JWT_SECRET:brewdesk-super-secret-key-change-this-in-production-123456789}

# Regularization attachment storage
upload.dir=uploads/regularization
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
